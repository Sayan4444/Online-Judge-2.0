apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment # Target the backend deployment
  minReplicas: 2
  maxReplicas: 10 # Scale up to 8 backend pods
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Target 80% of the requested CPU (80% of 500m)
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        # Target 80% of the requested memory (80% of 512Mi)
        averageUtilization: 80
